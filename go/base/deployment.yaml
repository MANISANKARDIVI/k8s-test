apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: go-test
  name: go
  labels:
    app: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go
  template:
    metadata:
      labels:
        app: go
    spec:
      containers:
        - name: go-container
          image: registry.digitalocean.com/elitebidder/mani-testing-go:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: go-svc
  namespace: go-test
spec:
  selector:
    app: go
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32222
  type: NodePort
